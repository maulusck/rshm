[project]
name = "rshm"
dynamic = ["version"]
readme = "README.md"
description = "Remote SHell Manager: a two-pane file manager for this machine and every host in your ~/.ssh/config"
requires-python = ">=3.9"
dependencies = []

[project.scripts]
rshm = "rshm.__main__:main"

[tool.setuptools]
packages = ["rshm"]

[tool.setuptools.dynamic]
version = { attr = "rshm.__version__" }

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

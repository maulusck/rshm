[project]
name = "rshm"
version = "1.0.0"
readme = "README.md"
description = "Remote SHell Manager: SSH hosts and SFTP in one curses screen"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
rshm = "rshm:main"

[tool.setuptools]
py-modules = ["rshm"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"
